name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0.0 or v1.0.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CSPROJ_PATH: src/FFXIVMomoTalk/FFXIVMomoTalk.csproj
      CHANGELOG_PATH: CHANGELOG.md
      ZIP_PATH: src/FFXIVMomoTalk/bin/Release/FFXIVMomoTalk/latest.zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release branch and version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Release workflow must be run from the 'main' branch (got '${GITHUB_REF}')."
            exit 1
          fi

          RAW="${INPUT_VERSION#"${INPUT_VERSION%%[![:space:]]*}"}"
          RAW="${RAW%"${RAW##*[![:space:]]}"}"
          VERSION="${RAW#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Version '${INPUT_VERSION}' is not a valid numeric version (expected e.g. 0.1.1 or 0.1.1.0)."
            exit 1
          fi

          TAG="v${VERSION}"
          if TAG_COMMIT="$(git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}")"; then
            if [[ "${TAG_COMMIT}" != "${GITHUB_SHA}" ]]; then
              # A completed release places the catalog commit on top of GITHUB_SHA;
              # an interrupted run may still have the tag on HEAD^ before moving it.
              TAG_PARENT="$(git rev-parse --verify --quiet "${TAG_COMMIT}^" || true)"
              HEAD_PARENT="$(git rev-parse --verify --quiet HEAD^ || true)"
              if [[ "${TAG_PARENT}" == "${GITHUB_SHA}" &&
                    "$(git log -1 --format=%s "${TAG_COMMIT}")" == "chore(release): ${TAG}" ]] &&
                 git diff --quiet "${GITHUB_SHA}" "${TAG_COMMIT}" -- . \
                    ':(exclude)pluginmaster.json' ":(exclude)${CSPROJ_PATH}" ":(exclude)${CHANGELOG_PATH}"; then
                :
              elif [[ "${TAG_COMMIT}" == "${HEAD_PARENT}" &&
                      "$(git log -1 --format=%s)" == "chore(release): ${TAG}" ]] &&
                   git diff --quiet "${TAG_COMMIT}" HEAD -- . \
                      ':(exclude)pluginmaster.json' ":(exclude)${CSPROJ_PATH}" ":(exclude)${CHANGELOG_PATH}"; then
                :
              else
                echo "::error::Tag '${TAG}' already points to a different source commit (${TAG_COMMIT})."
                exit 1
              fi
            fi
          else
            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prepare or resume GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if ! RELEASE="$(gh release view "${TAG}" --json databaseId,isDraft)"; then
            gh release create "${TAG}" --title "${TAG}" --draft --verify-tag --generate-notes
            RELEASE="$(gh release view "${TAG}" --json databaseId,isDraft)"
          fi

          RELEASE_ID="$(jq -er '.databaseId' <<< "${RELEASE}")"
          ASSET="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
            --jq '.[] | select(.name == "latest.zip")')"
          ASSET_STATE="$(jq -r '.state // empty' <<< "${ASSET}")"
          case "${ASSET_STATE}" in
            uploaded)
              echo "upload=false" >> "$GITHUB_OUTPUT"
              ;;
            starter)
              # GitHub can leave an empty placeholder after an interrupted upload.
              ASSET_ID="$(jq -er '.id' <<< "${ASSET}")"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}"
              echo "upload=true" >> "$GITHUB_OUTPUT"
              ;;
            '')
              echo "upload=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unexpected state of latest.zip: ${ASSET_STATE}."
              exit 1
              ;;
          esac
          echo "draft=$(jq -r '.isDraft' <<< "${RELEASE}")" >> "$GITHUB_OUTPUT"

      - name: Setup .NET 10
        if: steps.release.outputs.upload == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud assemblies
        if: steps.release.outputs.upload == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DALAMUD_DIR="${RUNNER_TEMP}/dalamud"
          mkdir -p "${DALAMUD_DIR}"
          DOWNLOAD_URL="$(curl -fsSL 'https://kamori.goats.dev/Dalamud/Release/VersionInfo?track=release' | jq -r '.downloadUrl')"
          if [[ -z "${DOWNLOAD_URL}" || "${DOWNLOAD_URL}" == "null" ]]; then
            echo "::error::Failed to resolve Dalamud downloadUrl from VersionInfo."
            exit 1
          fi
          curl -fsSL "${DOWNLOAD_URL}" -o "${RUNNER_TEMP}/dalamud.zip"
          unzip -q "${RUNNER_TEMP}/dalamud.zip" -d "${DALAMUD_DIR}"
          test -f "${DALAMUD_DIR}/Dalamud.dll"
          echo "DALAMUD_HOME=${DALAMUD_DIR}" >> "$GITHUB_ENV"

      - name: Update .csproj version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${CSPROJ_PATH}" "${VERSION}" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          version = sys.argv[2]
          text = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r"(<Version>)[^<]+(</Version>)",
              rf"\g<1>{version}\g<2>",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"Expected 1 <Version> element in {path}, found {count}.")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Restore and build Release
        if: steps.release.outputs.upload == 'true'
        env:
          ICON_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/src/Data/icon.png
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore ./FFXIVMomoTalk.slnx --locked-mode
          dotnet build "${CSPROJ_PATH}" -c Release -p:ContinuousIntegrationBuild=true -p:IconUrl="${ICON_URL}"
          unzip -tq "${ZIP_PATH}"

      - name: Upload and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          UPLOAD_ASSET: ${{ steps.release.outputs.upload }}
          IS_DRAFT: ${{ steps.release.outputs.draft }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${UPLOAD_ASSET}" == "true" ]]; then
            gh release upload "${TAG}" "${ZIP_PATH}"
          fi
          if [[ "${IS_DRAFT}" == "true" ]]; then
            gh release edit "${TAG}" --draft=false --verify-tag
          fi

      - name: Verify public ZIP, update changelog and pluginmaster.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          UPLOAD_ASSET: ${{ steps.release.outputs.upload }}
        shell: bash
        run: |
          set -euo pipefail
          ICON_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/src/Data/icon.png"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/latest.zip"
          PUBLISHED_ZIP="${RUNNER_TEMP}/published-latest.zip"
          PUBLISHED_MANIFEST="${RUNNER_TEMP}/FFXIVMomoTalk.json"
          CATALOG="${RUNNER_TEMP}/pluginmaster.json"

          curl -fsSL --retry 5 --retry-all-errors --retry-max-time 90 --max-time 90 \
            "${DOWNLOAD_URL}" -o "${PUBLISHED_ZIP}"
          if [[ "${UPLOAD_ASSET}" == "true" ]]; then
            cmp "${ZIP_PATH}" "${PUBLISHED_ZIP}"
          fi
          unzip -tq "${PUBLISHED_ZIP}"
          unzip -Z1 "${PUBLISHED_ZIP}" | grep -Fx 'FFXIVMomoTalk.dll' >/dev/null
          unzip -p "${PUBLISHED_ZIP}" FFXIVMomoTalk.json > "${PUBLISHED_MANIFEST}"
          jq -e --arg version "${VERSION}" '
            def assembly_version: split(".") | map(tonumber) | if length == 3 then . + [0] else . end;
            .InternalName == "FFXIVMomoTalk" and
            (.AssemblyVersion | assembly_version) == ($version | assembly_version)
          ' "${PUBLISHED_MANIFEST}" >/dev/null
          PUBLISHED_AT="$(gh release view "${TAG}" --json publishedAt --jq '.publishedAt')"
          LAST_UPDATE="$(date -d "${PUBLISHED_AT}" +%s)"
          jq --arg icon "${ICON_URL}" \
             --arg dl "${DOWNLOAD_URL}" \
             --argjson updated "${LAST_UPDATE}" \
             '[. + {
               IconUrl: $icon,
               DownloadLinkInstall: $dl,
               DownloadLinkUpdate: $dl,
               DownloadLinkTesting: $dl,
               LastUpdate: $updated
             }]' \
             "${PUBLISHED_MANIFEST}" > "${CATALOG}"

          point_tag_to() {
            local target_commit="$1"
            git tag -f "${TAG}" "${target_commit}"
            git push --force origin "refs/tags/${TAG}"
            gh release edit "${TAG}" --target "${target_commit}" --verify-tag
          }

          git fetch origin refs/heads/main
          MAIN_COMMIT="$(git rev-parse FETCH_HEAD)"
          if git show "${MAIN_COMMIT}:pluginmaster.json" | cmp -s - "${CATALOG}"; then
            if [[ "$(git log -1 --format=%s "${MAIN_COMMIT}")" == "chore(release): ${TAG}" &&
                  "$(git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}" || true)" != "${MAIN_COMMIT}" ]]; then
              point_tag_to "${MAIN_COMMIT}"
            fi
            echo "The public catalog already points to the verified release."
            exit 0
          fi
          if [[ "${MAIN_COMMIT}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Main advanced since this release started. The verified ZIP is published; the catalog was not changed."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          RELEASE_DATE="$(date -u -d "${PUBLISHED_AT}" +%Y-%m-%d)"
          python3 - "${CHANGELOG_PATH}" "${TAG}" "${RELEASE_DATE}" "https://github.com/${GITHUB_REPOSITORY}" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          tag = sys.argv[2]
          release_date = sys.argv[3]
          repo_url = sys.argv[4].rstrip("/")

          lines = path.read_text(encoding="utf-8").splitlines()

          unreleased_idx = None
          for i, line in enumerate(lines):
              if line.strip().lower() == "## [unreleased]":
                  unreleased_idx = i
                  break
          if unreleased_idx is None:
              raise SystemExit(f"Expected '## [Unreleased]' heading in {path}.")

          link_re = re.compile(r"^\[([^\]]+)\]:\s*(\S+)\s*$")
          end_nonempty = len(lines) - 1
          while end_nonempty >= 0 and not lines[end_nonempty].strip():
              end_nonempty -= 1

          links_start = end_nonempty + 1
          while links_start > 0 and link_re.match(lines[links_start - 1]):
              links_start -= 1

          body_lines = lines[:links_start]
          link_lines = lines[links_start : end_nonempty + 1]

          version_heading_re = re.compile(r"^## \[([^\]]+)\]")
          next_section_idx = None
          prev_tag = None
          already_released = False
          for i, line in enumerate(body_lines):
              if i <= unreleased_idx:
                  continue
              m = version_heading_re.match(line.strip())
              if m:
                  if next_section_idx is None:
                      next_section_idx = i
                      prev_tag = m.group(1)
                  if m.group(1) == tag:
                      already_released = True

          if not already_released:
              unreleased_end = next_section_idx if next_section_idx is not None else len(body_lines)
              unreleased_body = body_lines[unreleased_idx + 1 : unreleased_end]
              while unreleased_body and not unreleased_body[0].strip():
                  unreleased_body.pop(0)
              while unreleased_body and not unreleased_body[-1].strip():
                  unreleased_body.pop()

              new_section = [f"## [{tag}] - {release_date}"]
              if unreleased_body:
                  new_section.append("")
                  new_section.extend(unreleased_body)

              rest = body_lines[unreleased_end:]
              while rest and not rest[0].strip():
                  rest.pop(0)

              updated_body = body_lines[: unreleased_idx + 1] + [""] + new_section
              if rest:
                  updated_body.append("")
                  updated_body.extend(rest)
              body_lines = updated_body

          parsed_links = []
          for line in link_lines:
              m = link_re.match(line)
              if m:
                  parsed_links.append((m.group(1), m.group(2)))

          if prev_tag is None:
              for label, url in parsed_links:
                  if label.lower() == "unreleased":
                      m = re.search(r"/compare/(.+?)\.\.\.", url)
                      if m:
                          prev_tag = m.group(1)
                      break

          if prev_tag == tag:
              prev_tag = None
              seen_tag = False
              for line in body_lines:
                  m = version_heading_re.match(line.strip())
                  if not m:
                      continue
                  if m.group(1) == tag:
                      seen_tag = True
                  elif seen_tag:
                      prev_tag = m.group(1)
                      break

          filtered_links = [
              (label, url)
              for label, url in parsed_links
              if label.lower() != "unreleased" and label != tag
          ]

          tag_url = (
              f"{repo_url}/compare/{prev_tag}...{tag}"
              if prev_tag
              else f"{repo_url}/commits/{tag}"
          )
          new_links = [
              ("unreleased", f"{repo_url}/compare/{tag}...main"),
              (tag, tag_url),
          ] + filtered_links

          while body_lines and not body_lines[-1].strip():
              body_lines.pop()

          result_lines = body_lines + [""] + [f"[{k}]: {v}" for k, v in new_links]
          path.write_text("\n".join(result_lines) + "\n", encoding="utf-8")
          PY

          cp "${CATALOG}" pluginmaster.json
          git add "${CSPROJ_PATH}" "${CHANGELOG_PATH}" pluginmaster.json
          git commit -m "chore(release): ${TAG}"
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/main
          point_tag_to "${RELEASE_COMMIT}"
