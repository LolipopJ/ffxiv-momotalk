name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0.0 or v1.0.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CSPROJ_PATH: src/FFXIVMomoTalk/FFXIVMomoTalk.csproj
      MANIFEST_PATH: src/FFXIVMomoTalk/bin/Release/FFXIVMomoTalk/FFXIVMomoTalk.json
      ZIP_PATH: src/FFXIVMomoTalk/bin/Release/FFXIVMomoTalk/latest.zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release branch and version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Release workflow must be run from the 'main' branch (got '${GITHUB_REF}')."
            exit 1
          fi

          RAW="${INPUT_VERSION#"${INPUT_VERSION%%[![:space:]]*}"}"
          RAW="${RAW%"${RAW##*[![:space:]]}"}"
          VERSION="${RAW#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Version '${INPUT_VERSION}' is not a valid numeric version (expected e.g. 0.1.1 or 0.1.1.0)."
            exit 1
          fi

          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag '${TAG}' already exists."
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud assemblies
        shell: bash
        run: |
          set -euo pipefail
          DALAMUD_DIR="${RUNNER_TEMP}/dalamud"
          mkdir -p "${DALAMUD_DIR}"
          DOWNLOAD_URL="$(curl -fsSL 'https://kamori.goats.dev/Dalamud/Release/VersionInfo?track=release' | jq -r '.downloadUrl')"
          if [[ -z "${DOWNLOAD_URL}" || "${DOWNLOAD_URL}" == "null" ]]; then
            echo "::error::Failed to resolve Dalamud downloadUrl from VersionInfo."
            exit 1
          fi
          curl -fsSL "${DOWNLOAD_URL}" -o "${RUNNER_TEMP}/dalamud.zip"
          unzip -q "${RUNNER_TEMP}/dalamud.zip" -d "${DALAMUD_DIR}"
          test -f "${DALAMUD_DIR}/Dalamud.dll"
          echo "DALAMUD_HOME=${DALAMUD_DIR}" >> "$GITHUB_ENV"

      - name: Update .csproj version
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${CSPROJ_PATH}" "${{ steps.version.outputs.version }}" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          version = sys.argv[2]
          text = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r"(<Version>)[^<]+(</Version>)",
              rf"\g<1>{version}\g<2>",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"Expected 1 <Version> element in {path}, found {count}.")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Restore and build Release
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore ./FFXIVMomoTalk.slnx --locked-mode
          dotnet build "${CSPROJ_PATH}" -c Release -p:ContinuousIntegrationBuild=true
          test -f "${MANIFEST_PATH}"
          test -f "${ZIP_PATH}"

      - name: Update pluginmaster.json
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          ICON_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/src/Data/icon.png"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/latest.zip"
          LAST_UPDATE="$(date +%s)"
          jq --arg icon "${ICON_URL}" \
             --arg dl "${DOWNLOAD_URL}" \
             --argjson updated "${LAST_UPDATE}" \
             '[. + {
               IconUrl: $icon,
               DownloadLinkInstall: $dl,
               DownloadLinkUpdate: $dl,
               DownloadLinkTesting: $dl,
               LastUpdate: $updated
             }]' \
             "${MANIFEST_PATH}" > pluginmaster.json

      - name: Commit version updates, tag, and push
        id: push
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${CSPROJ_PATH}" pluginmaster.json
          git commit -m "chore(release): ${TAG}"
          git tag "${TAG}" HEAD
          git push --atomic origin HEAD:refs/heads/main "refs/tags/${TAG}"

          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "${TAG}" "${ZIP_PATH}" \
            --title "${TAG}" \
            --target "${{ steps.push.outputs.release_sha }}" \
            --generate-notes
